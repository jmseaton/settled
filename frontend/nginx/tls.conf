# TLS. Selected at container start when a certificate and key are present
# under /etc/nginx/certs — see docker-entrypoint.d/20-settled-tls.sh.

server {
    listen 80;
    server_name _;

    # The healthcheck and the documented `curl .../health` are allowed to
    # stay on plain HTTP: they carry no credential, and a redirect here
    # would break a self-signed deployment's health probe for no gain.
    location /health {
        proxy_pass http://backend:8000/health;
    }

    # Everything else goes to TLS. The target is written at container start
    # rather than hard-coded, because the published HTTPS port is usually
    # 8443 rather than 443 and `https://$host$request_uri` would silently
    # send the browser to a port nothing is listening on.
    include /etc/nginx/settled/redirect.conf;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # TLS 1.2 as the floor. 1.3 alone would be defensible in 2031 and
    # locks out nothing this app is reached from; 1.2 costs nothing and
    # covers whatever old tablet ends up being the second screen.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    # Tickets without rotation are worse than no tickets: the key sits in
    # memory for the life of the process and breaks forward secrecy.
    ssl_session_tickets off;

    # HSTS, written at container start and off by default. On a self-signed
    # certificate it is an actively bad idea — it turns the browser's
    # click-through warning into a wall with no bypass, on the exact host
    # you need to reach. Turn it on with a real certificate and not before.
    include /etc/nginx/settled/hsts.conf;

    include /etc/nginx/settled/app.conf;
}
