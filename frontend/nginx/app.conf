# What the app serves, independent of whether it is reached over TLS.
# Included by both nginx/http.conf and the TLS server in nginx/tls.conf, so
# the two deployments cannot drift apart in the parts that matter.

root /usr/share/nginx/html;
index index.html;

gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;
gzip_min_length 1024;

include /etc/nginx/settled/security-headers.conf;

# Statement uploads (§3.1). nginx defaults to 1MB, which a year of Flex
# XML clears easily; the rejection would arrive as an opaque 413.
client_max_body_size 64m;

# The API is proxied on the same origin rather than called cross-origin.
# The frontend already fetches relative `/api/...` paths, so this needs no
# build-time API URL and raises no CORS question at all — one fewer thing
# to get wrong when the host is a LAN box rather than localhost.
location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # §1.3a — the backend decides whether to mark the session cookie Secure
    # from this header, because it only ever speaks plain HTTP itself and
    # cannot otherwise tell a TLS deployment from a bare one.
    proxy_set_header X-Forwarded-Proto $scheme;

    # A manual sync or a full rebuild runs well past the 60s default,
    # and a gateway timeout mid-import looks like a failure while the
    # work is still going.
    proxy_connect_timeout 30s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
}

location /health {
    proxy_pass http://backend:8000/health;
}

# Hashed build assets are immutable; index.html must never be cached or
# a deploy leaves the browser loading a stale bundle against a new API.
location /assets/ {
    include /etc/nginx/settled/security-headers.conf;
    expires 1y;
    add_header Cache-Control "public, immutable";
}

location / {
    include /etc/nginx/settled/security-headers.conf;
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
}
