# Included in *every* context that calls add_header, not just at server
# level. nginx's add_header does not merge: a location with an add_header of
# its own drops every header inherited from its parent, so the two blocks
# below that set Cache-Control would silently lose these if this were
# declared once at the top.
#
# None of these are new requirements — they became worth setting when there
# started to be a session cookie worth stealing (§1.3a).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
