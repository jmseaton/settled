# Included in *every* context that calls add_header, not just at server
# level. nginx's add_header does not merge: a location with an add_header of
# its own drops every header inherited from its parent, so the two blocks
# below that set Cache-Control would silently lose these if this were
# declared once at the top.
#
# None of these are new requirements — they became worth setting when there
# started to be a session cookie worth stealing (§1.3a).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;

# Content-Security-Policy. The bundle carries no inline script, no eval, no
# `new Function` and no worker, and reaches no host but its own — checked
# against the built output, not assumed — so everything can be 'self'.
#
# The one relaxation is style-src: React writes `style={{…}}` as inline style
# attributes and echarts sizes its container the same way, so 'unsafe-inline'
# there is load-bearing. It is also the least dangerous of the relaxations —
# script is what executes.
#
# frame-ancestors 'none' is the one that pairs with the session cookie: it is
# the modern X-Frame-Options and stops the UI being framed for clickjacking.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
