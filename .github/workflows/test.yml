name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: nothing here writes to the repository.
permissions:
  contents: read

# A newer push to the same branch makes an in-flight run obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is the version §13 targets; 3.11 is what the app was built
        # and verified on. Both are supported until one of them stops being.
        python-version: ['3.11', '3.12']

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: settled
          POSTGRES_PASSWORD: settled_dev
          POSTGRES_DB: settled_test
        ports:
          - 5432:5432
        # Without the health check the job races the container and fails
        # on connection refused rather than on anything real.
        options: >-
          --health-cmd "pg_isready -U settled"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SETTLED_DATABASE_URL: postgresql+psycopg://settled:settled_dev@localhost:5432/settled_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        working-directory: backend
        run: python -m pytest tests/ -q

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # `tsc --noEmit` against the root config checks nothing: tsconfig.json
      # is solution-style ("files": [], with references), so the build-mode
      # flag is what actually walks the referenced projects.
      - name: Type-check
        working-directory: frontend
        run: npx tsc -b --force

      - name: Build
        working-directory: frontend
        run: npm run build

  deployment:
    name: Deployment stack starts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The compose stack is a deliverable now, and nothing else in CI would
      # notice it breaking. Building the images proves they build; standing
      # them up proves the parts nobody can unit-test actually work — the
      # entrypoint's database wait, schema creation, the drift report, and
      # nginx reaching the API by service name.
      - name: Write a throwaway .env
        run: echo "POSTGRES_PASSWORD=ci_only_not_a_real_secret" > .env

      - name: Build and start
        run: docker compose up -d --build

      - name: Wait for the stack to answer through nginx
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/health > /dev/null; then
              echo "healthy after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "never became healthy"; exit 1

      - name: The API is reachable on the same origin as the UI
        run: |
          curl -fsS http://localhost:8080/api/settings > /dev/null
          # The app itself navigates by state rather than by URL, so this is
          # not about deep links — it checks the try_files fallback is wired
          # at all, which is what stops a stray path from 404ing and what a
          # future router would depend on.
          curl -fsS http://localhost:8080/trades | grep -q '<div id="root">'

      - name: The entrypoint reported a clean schema
        run: docker compose logs backend | grep -q "Schema matches the ORM metadata"

      # §1.3a. The unit tests cover the gate against the ASGI app directly;
      # what they cannot cover is the half that only exists in the
      # deployment — nginx choosing a TLS config from a mounted certificate,
      # the redirect knowing the published port, and X-Forwarded-Proto
      # reaching the backend so the session cookie comes back Secure.
      - name: Restart the stack with a password and a certificate
        run: |
          docker compose down
          ./scripts/generate-self-signed-cert.sh localhost 127.0.0.1
          HASH=$(printf '%s' 'ci_only_not_a_real_password' \
            | docker compose run --rm --no-deps -T --entrypoint python backend -m app.auth --stdin \
            | tail -1)
          test -n "$HASH"
          cat >> .env <<EOF
          SETTLED_AUTH_PASSWORD_HASH=$HASH
          SETTLED_API_TOKEN=ci_only_not_a_real_token
          SETTLED_TLS=on
          EOF
          docker compose up -d

      - name: Wait for the secured stack
        run: |
          for i in $(seq 1 60); do
            # /health is deliberately still plain HTTP and still open: it is
            # what the container healthcheck calls.
            if curl -fsS http://localhost:8080/health > /dev/null; then
              echo "healthy after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "never became healthy"; docker compose logs; exit 1

      - name: The compose value survived .env intact
        run: |
          # Compose interpolates `$` in .env values, which is why the hash is
          # colon-separated. If that ever regresses, the symptom is a correct
          # password being rejected — so check the container got the whole thing.
          docker compose exec -T backend printenv SETTLED_AUTH_PASSWORD_HASH \
            | grep -Eq '^scrypt:[0-9]+:[0-9]+:[0-9]+:[^:]+:[^:]+$'

      - name: TLS is served and HTTP redirects to it
        run: |
          curl -fsSk https://localhost:8443/health > /dev/null
          # -o /dev/null so a redirect body cannot mask a wrong Location.
          location=$(curl -sS -o /dev/null -D - http://localhost:8080/trades \
            | tr -d '\r' | awk '/^[Ll]ocation:/ {print $2}')
          test "$location" = "https://localhost:8443/trades" \
            || { echo "redirected to '$location'"; exit 1; }

      - name: The API is closed without a session
        run: |
          code=$(curl -sSk -o /dev/null -w '%{http_code}' https://localhost:8443/api/settings)
          test "$code" = "401" || { echo "got $code, expected 401"; exit 1; }

      - name: Signing in opens it, and the cookie comes back Secure
        run: |
          headers=$(curl -sSk -D - -o /dev/null -c /tmp/jar \
            -X POST https://localhost:8443/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"password":"ci_only_not_a_real_password"}')
          echo "$headers" | grep -i '^set-cookie:' | grep -q 'HttpOnly'
          # The backend speaks plain HTTP behind nginx, so this passing means
          # X-Forwarded-Proto arrived and was believed.
          echo "$headers" | grep -i '^set-cookie:' | grep -q 'Secure'
          curl -fsSk -b /tmp/jar https://localhost:8443/api/settings > /dev/null

      - name: The bearer token still drives sync from outside a browser
        run: |
          # §3.8's documented host-cron path. Sync is not configured in CI,
          # so 400 is the right answer — 401 would mean the token was ignored.
          code=$(curl -sSk -o /dev/null -w '%{http_code}' -X POST \
            -H 'Authorization: Bearer ci_only_not_a_real_token' \
            https://localhost:8443/api/sync/run)
          test "$code" = "400" || { echo "got $code, expected 400"; exit 1; }

      - name: Security headers survive the per-location Cache-Control
        run: |
          # nginx's add_header does not merge into a block that sets its own,
          # and both of the blocks serving the app set Cache-Control.
          headers=$(curl -sSk -D - -o /dev/null https://localhost:8443/)
          echo "$headers" | grep -qi 'X-Content-Type-Options: nosniff'
          echo "$headers" | grep -qi 'X-Frame-Options: DENY'
          echo "$headers" | grep -qi 'Cache-Control: no-cache'

      - name: Logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v

  fixtures:
    name: Fixtures still anonymized
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # fixtures/README.md: "Git history is permanent — anonymize before
      # the first commit, not after." This is the only check in the repo that
      # cannot be usefully run after the fact, so it runs on every PR.
      - name: Check fixtures carry no real identifiers or broker-era dates
        run: python scripts/check_fixtures_scrubbed.py
